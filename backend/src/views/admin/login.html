<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login - PR Check AI Agent</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #f3f4f6;

            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        .box {
            width: 100%;
            max-width: 400px;

            background: white;

            padding: 32px;

            border-radius: 16px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, .08);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 24px;
        }

        p {
            color: #6b7280;
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;

            margin-bottom: 16px;

            border:
                1px solid #d1d5db;

            border-radius: 8px;

            font-size: 15px;
        }

        button {
            width: 100%;

            padding: 12px;

            border: 0;
            border-radius: 8px;

            background: #111827;
            color: white;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;
        }

        .error {
            margin-bottom: 16px;
            padding: 10px;

            background: #fee2e2;
            color: #991b1b;

            border-radius: 8px;

            font-size: 14px;
        }

    </style>
</head>

<body>

<div class="box">

    <h1>PR Check AI Agent</h1>

    <p>Administrator Login</p>

    <!--ERROR-->

    <form method="POST" action="/admin/login">

        <label>Username</label>

        <input
            name="username"
            type="text"
            required
            autocomplete="username"
        >

        <label>Password</label>

        <input
            name="password"
            type="password"
            required
            autocomplete="current-password"
        >

        <button type="submit">
            Sign in
        </button>

    </form>

</div>

</body>
</html>
